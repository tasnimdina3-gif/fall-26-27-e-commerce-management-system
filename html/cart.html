<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>

<body>
    <form border="1">
        <fieldset>
            <img src="../image/cart.jpg" alt="Cart Image" width="350" heigh="450">
            <h1>Phoenix Shopping Cart</h1>
            <div id="cartItems">
                <p class="productNames">Wireless Headset</p>
                <p class="productPrice">৳1499</p>
                <button id="btnProductPlus">+</button>
                <button id="btnProductMinus">-</button>
            </div>
            <h3>Total : <span id="cartTotal">৳1499</span></h3>
            <a href="index.html" id="btnContinueShopping">Continue Shopping</a>
            <a href="payment.html" id="btnProceedToPay">Proceed to Pay</a>
        </fieldset>
    </form>
</body>

</html>
